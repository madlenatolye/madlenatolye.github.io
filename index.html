.fbv{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px;border-radius:0;overflow:hidden;box-sizing:border-box;font-family:inherit;transition:background .3s;background-color:#efeee7;width:100%}
.fbv.full{border-radius:0;min-height:100vh;height:100vh;padding:12px 18px;justify-content:space-between;box-sizing:border-box}
.fbv .ov{position:absolute;inset:0;pointer-events:none}
.fbh{display:flex;justify-content:space-between;align-items:center;width:100%;gap:16px;z-index:10}
.fbh.rv{flex-direction:row-reverse}.fbh.rv p{text-align:left}
.fbh img{max-height:44px;max-width:38%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.fbh p{margin:0;font-size:.8125rem;line-height:1.4;text-align:right;max-width:58%;white-space:pre-line;font-weight:600;letter-spacing:-.01em}

/* 3D Realistic Stage & Hard Board Architecture */
.stage{position:relative;width:100%;height:clamp(380px,52vh,520px);display:flex;align-items:center;justify-content:center;touch-action:pan-y;z-index:2;perspective:2600px;-webkit-perspective:2600px;overflow:hidden}
.fbv.full .stage{height:calc(100vh - 100px);max-height:none}
.rh{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;font:600 12px system-ui,sans-serif;padding:8px 14px;border-radius:999px;z-index:20;pointer-events:none;white-space:nowrap;animation:rhf 4.5s ease forwards}@keyframes rhf{0%,85%{opacity:1}100%{opacity:0}}
@media (orientation:landscape) and (max-height:520px){.fbv{padding:6px 10px;gap:4px;border-radius:0}.stage{height:calc(100vh - 78px);height:calc(100dvh - 78px);max-height:none}.fbv.full .stage{height:calc(100vh - 66px);height:calc(100dvh - 66px)}}
#wrap{position:relative;display:flex;align-items:center;justify-content:center;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
#book{position:relative;z-index:2}
#board{position:absolute;z-index:1;border-radius:8px 14px 14px 8px;box-shadow:0 34px 50px -8px rgba(0,0,0,.6),0 10px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12);transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s,width .55s cubic-bezier(.3,.7,.2,1),height .55s}
.stk{position:absolute;background:repeating-linear-gradient(90deg,var(--e1) 0 1px,var(--e2) 1px 2px);box-shadow:inset 0 0 4px rgba(0,0,0,.55);transition:width .4s}
.stk.l{left:calc(var(--O) - var(--wl));width:var(--wl);top:var(--O);bottom:var(--O)}
.stk.r{right:calc(var(--O) - var(--wr));width:var(--wr);top:var(--O);bottom:var(--O)}
.stk.b{left:var(--O);right:var(--O);bottom:calc(var(--O) - 5px);height:5px;background:repeating-linear-gradient(0deg,var(--e1) 0 1px,var(--e2) 1px 2px)}
#rib{position:absolute;left:calc(50% - 6px);bottom:-46px;width:12px;height:58px;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:3}
#rings{position:absolute;z-index:6;width:30px;pointer-events:none;display:none;background:radial-gradient(ellipse at 50% 50%,#111 0 4px,transparent 5px),radial-gradient(ellipse at 50% 50%,#e8e8ee 0 9px,#7d7d86 11px,transparent 12px);background-size:30px 30px;filter:drop-shadow(1px 3px 2px rgba(0,0,0,.5))}
#band{position:absolute;z-index:6;width:11px;display:none;pointer-events:none;background:linear-gradient(90deg,#7d0c20,#c21a3a 50%,#6d0a1b);box-shadow:2px 0 4px rgba(0,0,0,.5);transition:opacity .3s}

/* Page, Endpaper & Cover Textures */
.page{width:100%;height:100%;overflow:hidden;background-color:#fff}
.paper{width:100%;height:100%;position:relative;display:flex;flex-direction:column}
.pi{background:#fff}.pi img{width:100%;height:100%;object-fit:contain;display:block}
.pi::after,.endp::after{content:"";position:absolute;inset:0;pointer-events:none}
.--left .pi::after,.--left .endp::after{box-shadow:inset -30px 0 30px -18px rgba(60,40,10,.5)}
.--right .pi::after,.--right .endp::after{box-shadow:inset 30px 0 30px -18px rgba(60,40,10,.5)}
.cov{align-items:center;justify-content:center;overflow:hidden}
.cov.hg::before{content:"";position:absolute;z-index:3;top:0;bottom:0;width:3px;background:rgba(0,0,0,.5);box-shadow:1px 0 0 rgba(255,255,255,.14)}
.cov-f.hg::before{left:6%}
.cov-b.hg::before{right:6%}
.stitch{position:absolute;inset:3.2%;border:2px dashed var(--st);border-radius:8px;pointer-events:none}
.frame{position:absolute;inset:9% 9% 9% 12%;border:2px solid;box-shadow:0 1px 0 rgba(255,255,255,.16),inset 0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.cov-b .frame{inset:9% 12% 9% 9%}
.frame.lx{border-image:var(--foil) 1;box-shadow:0 0 0 6px transparent,0 0 0 7px var(--st)}
.spn{position:absolute;top:0;bottom:0;box-shadow:inset -6px 0 8px rgba(0,0,0,.5);pointer-events:none}
.cn{position:absolute;width:34px;height:34px;pointer-events:none}
.ttl{position:relative;text-align:center;padding:0 6%;max-width:94%;z-index:2}
.ttl h2{margin:8px 0;font-size:clamp(16px,3vw,30px);font-weight:400;letter-spacing:.06em;line-height:1.25;word-break:break-word}
.ttl span{font-size:clamp(9px,1.3vw,12px);letter-spacing:.3em}
.lx{filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.lx h2{letter-spacing:.14em;text-transform:uppercase;font-family:Georgia,serif}
.foil{display:inline-block;background:var(--foil);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-240% 0}}
.mono{display:grid;place-items:center;width:clamp(34px,6vw,54px);height:clamp(34px,6vw,54px);border:2px solid var(--bc);border-radius:50%;margin:0 auto 10px;font:italic clamp(17px,3vw,28px) Georgia,serif}
.lbl{background:#f3ead2;color:#222!important;padding:12px 16px;border:2px double #8a7a55;text-shadow:none!important;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.glz{position:absolute;inset:0;z-index:2;pointer-events:none}

/* StPageFlip Engine Styles */
.stf__parent{position:relative;display:block;box-sizing:border-box;transform:translateZ(0);-ms-touch-action:pan-y;touch-action:pan-y;margin:auto}
.sft__wrapper{position:relative;width:100%;box-sizing:border-box}
.stf__parent canvas{position:absolute;width:100%;height:100%;left:0;top:0}
.stf__block{position:absolute;width:100%;height:100%;box-sizing:border-box;perspective:2600px}
.stf__item{display:none;position:absolute;transform-style:preserve-3d}
.stf__outerShadow{position:absolute;left:0;top:0}
.stf__innerShadow{position:absolute;left:0;top:0}
.stf__hardShadow{position:absolute;left:0;top:0}
.stf__hardInnerShadow{position:absolute;left:0;top:0}

/* Viewer Controls Bar */
.ct{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;z-index:10;background:rgba(28,32,26,.88);padding:6px 12px;border-radius:999px;color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 30px -5px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);margin-top:4px}
.ct button{all:unset;cursor:pointer;width:34px;height:34px;text-align:center;line-height:34px;border-radius:50%;font-size:1.05rem;transition:all .15s;display:flex;align-items:center;justify-content:center}
.ct button:hover,.ct button:focus-visible{background:rgba(255,255,255,.2);transform:scale(1.08)}
.ct button svg{display:block;pointer-events:none}
.ct .sep{display:none}
.fbv.clean .ct{background:#ffffff;color:#1c201a;gap:2px;padding:4px 8px;border:1px solid #e5e5df;border-radius:999px;box-shadow:0 2px 10px -2px rgba(0,0,0,.06);position:relative;order:1;align-self:flex-end;margin:0 4px 0 0;flex-wrap:nowrap;z-index:12;-webkit-backdrop-filter:none;backdrop-filter:none}
.fbv.clean .ct button{width:32px;height:32px;color:#575a53;border-radius:50%;transition:all .15s}
.fbv.clean .ct button:hover,.fbv.clean .ct button:focus-visible{background:#f6f5f3;color:#3158d5;transform:scale(1.06)}
.fbv.clean .ct .pg{color:#1c201a;font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;font-size:.75rem}
.fbv.clean .ct .sep{display:block;width:1px;height:18px;background:#e5e5df;margin:0 6px}
.fbv.clean .ct svg{width:18px;height:18px}
.fbv.clean .th img{box-shadow:0 2px 6px rgba(0,0,0,.08);border-radius:6px;border:2px solid transparent;transition:all .18s}
.fbv.clean .th img:hover,.fbv.clean .th img.on{border-color:#3158d5;transform:translateY(-2px)}
.fbv.clean .th{background:#ffffff;border:1px solid #e5e5df;border-radius:16px;padding:10px 14px;box-shadow:0 4px 16px -2px rgba(0,0,0,.06)}
.fbv.clean .cr{opacity:.75;color:#70746d;font-size:11px;font-weight:600}
.fbv.clean .cr:hover{color:#3158d5;opacity:1}
.nv{display:none}
.fbv.clean .nv{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:720px;z-index:10;color:#1c201a;background:#ffffff;border:1px solid #e5e5df;padding:6px 14px;border-radius:999px;box-shadow:0 2px 12px -2px rgba(0,0,0,.06)}
.fbv.clean .nv button{all:unset;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#1c201a;background:#f6f5f3;border:1px solid #e5e5df;transition:all .15s}
.fbv.clean .nv button:hover,.fbv.clean .nv button:focus-visible{background:#efeee7;color:#3158d5;border-color:#3158d5;transform:scale(1.06)}
.fbv.clean .nv svg{width:18px;height:18px}
.fbv.clean .nv .pg{font-size:.75rem;min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:#1c201a;background:#faf9f6;padding:3px 10px;border-radius:999px;border:1px solid #e5e5df}
.fbv.clean .sl{-webkit-appearance:none;appearance:none;flex:1;min-width:80px;height:5px;border-radius:999px;background:#e5e5df;outline:none;cursor:pointer;margin:0}
.fbv.clean .sl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#3158d5;border:2px solid #ffffff;box-shadow:0 2px 6px rgba(49,88,213,.35);transition:transform .15s;cursor:pointer}
.fbv.clean .sl::-webkit-slider-thumb:hover{transform:scale(1.2)}
.fbv.clean .sl::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#3158d5;border:2px solid #ffffff;box-shadow:0 2px 6px rgba(49,88,213,.35);cursor:pointer}
.fbv.clean .fbh{order:0;align-self:stretch}.fbv.clean .stage{order:2}.fbv.clean .nv{order:3}.fbv.clean .th{order:4}
.fbv.clean .stage{height:clamp(420px,68vh,760px)}
.fbv.clean.full{justify-content:flex-start}
.fbv.clean.full .stage{height:auto;flex:1 1 0;min-height:240px;max-height:none}
.fbv.flat #book{filter:drop-shadow(0 16px 24px rgba(0,0,0,.15))}
.fbv.clean.dk .ct{background:#1c201a;color:#ffffff;border-color:rgba(255,255,255,.15)}
.fbv.clean.dk .ct button{color:#d1d5db}
.fbv.clean.dk .ct button:hover{background:rgba(255,255,255,.15);color:#ffffff}
.fbv.clean.dk .nv{background:#1c201a;color:#ffffff;border-color:rgba(255,255,255,.15)}
.fbv.clean.dk .nv button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#ffffff}
.fbv.clean.dk .nv button:hover{background:rgba(255,255,255,.2);color:#ffffff;border-color:#3158d5}
.fbv.clean.dk .nv .pg{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#ffffff}
.fbv.clean.dk .sl{background:rgba(255,255,255,.24)}
.fbv.clean.dk .sl::-webkit-slider-thumb{background:#3158d5;border-color:#ffffff}
.fbv.clean.dk .sl::-moz-range-thumb{background:#3158d5;border-color:#ffffff}
/* Browse display modes (Glide, Deck, Arc, Single, Scroll, Wall, Fan) */
.fbv.alt .stage{perspective:none;-webkit-perspective:none;overflow:hidden;touch-action:pan-y}
.fbv.alt.alt-glide .stage,.fbv.alt.alt-scroll .stage,.fbv.alt.alt-wall .stage{touch-action:auto}
.astg{position:absolute;inset:0}
.alt-arc .astg{perspective:1500px;-webkit-perspective:1500px;transform-style:preserve-3d}
.ai{position:absolute;left:50%;top:50%;width:var(--iw);height:var(--ih);margin:calc(var(--ih) / -2) 0 0 calc(var(--iw) / -2);border-radius:6px;background:#fff;box-shadow:0 12px 32px -10px rgba(15,23,42,.4),0 0 0 1px rgba(15,23,42,.05);overflow:hidden;transition:transform .5s cubic-bezier(.3,.7,.2,1),opacity .4s,filter .4s;will-change:transform;cursor:pointer}
.ai img{width:100%;height:100%;object-fit:contain;display:block;background:#fff;user-select:none;-webkit-user-drag:none}
.alt-single .ai{cursor:default}
.alt-arc .ai{transform-style:preserve-3d}
.alt-fan .ai{transform-origin:50% 135%}
.gl,.sc,.wl{position:absolute;inset:0;box-sizing:border-box}
.gl{display:flex;align-items:center;gap:18px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gl::-webkit-scrollbar,.sc::-webkit-scrollbar{display:none}
.gl .ai,.sc .ai,.wl .ai{position:relative;left:auto;top:auto;margin:0;transition:none;flex:0 0 auto;scroll-snap-align:center}
.gl .ai{width:var(--iw);height:var(--ih)}
.sc{overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0;scrollbar-width:none}
.sc .ai{width:var(--iw);height:var(--ih);cursor:default}
.wl{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px;align-content:start}
.wl .ai{width:100%;height:auto;aspect-ratio:var(--iw) / var(--ih)}
.wl .ai:hover{box-shadow:0 14px 34px -10px rgba(15,23,42,.55),0 0 0 2px #2563eb}
.fbv.alt .th img.on{border-color:#2563eb}
.alt-wall .nv,.alt-wall .th{display:none!important}
.lb{position:absolute;inset:0;z-index:30;background:rgba(15,23,42,.94);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.lb img{max-width:min(78%,900px);max-height:88%;object-fit:contain;background:#fff;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.lb button:hover,.lb button:focus-visible{background:rgba(255,255,255,.28)}
.lbx{position:absolute;top:12px;right:14px;width:40px;height:40px;font-size:26px;line-height:1}
.lbn{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px}
.lbn.l{left:14px}.lbn.r{right:14px}
.lbn svg{width:24px;height:24px}
.lbc{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#e2e8f0;font:600 12px system-ui,sans-serif}
